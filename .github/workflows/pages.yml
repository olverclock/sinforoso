# Publica a página do bot (pasta site/) no GitHub Pages, de graça.
# No GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Versões iguais às do modelo oficial "Static HTML" do GitHub (actions/starter-workflows, pages/static.yml).
# Duas etapas (empacotar → publicar), como nos modelos maiores do GitHub: a publicação só começa depois
# que o pacote terminou de ser registrado (evita o erro intermitente "No artifacts named github-pages").
# Roda sozinho quando algo dentro de site/ muda na branch main (ou manualmente na aba Actions).
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: empacotar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
