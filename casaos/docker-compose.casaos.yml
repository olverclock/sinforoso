# Sinforoso no CasaOS (botão "Instalar app personalizado" → "Importar").
# Pré-requisito: a imagem já construída no Orange Pi. Na pasta do projeto, rode uma vez:
#   docker compose build
# (gera a imagem local "sinforoso-whatsapp:latest"; "pull_policy: never" impede o CasaOS de
# procurar a imagem na internet). Formato x-casaos v2: https://www.zimaspace.com/docs/developer/app-store-compose-x-casaos
# Não suba este arquivo e o docker-compose.yml da raiz ao mesmo tempo: os dois usam o container "sinforoso".
name: sinforoso
services:
  sinforoso:
    image: sinforoso-whatsapp:latest
    pull_policy: never
    container_name: sinforoso
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 512
    mem_limit: 4g
    cpus: "3.0"
    stdin_open: true
    tty: true
    env_file:
      - path: /DATA/AppData/sinforoso/.env
        required: false
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: /DATA/AppData/sinforoso/storage
        target: /app/storage
      - type: bind
        source: /DATA/AppData/sinforoso/backups
        target: /app/backups
        bind:
          create_host_path: true
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2147483648
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

x-casaos:
  id: com.sinforoso.whatsapp
  main: sinforoso
  index: /
  port_map: ""
  scheme: http
  architectures:
    - arm64
    - amd64
  category: Social
  version: "3.6.0"
  author: olverclock
  developer: olverclock
  title:
    en_US: Sinforoso
    pt_BR: Sinforoso
  tagline:
    en_US: WhatsApp bot with stickers, downloads, games, automations and PDF tools
    pt_BR: Bot de WhatsApp com figurinhas, downloads, jogos, automações e ferramentas de PDF
  description:
    en_US: Brazilian WhatsApp bot. Runs fully on your server; the WhatsApp session and data stay in /DATA/AppData/sinforoso.
    pt_BR: Bot brasileiro para WhatsApp. Roda inteiro no seu servidor; a sessão do WhatsApp e os dados ficam em /DATA/AppData/sinforoso.
  tips:
    before_install:
      en_US: Build the image first with "docker compose build" in the project folder, and create /DATA/AppData/sinforoso/.env from .env.example.
      pt_BR: Construa a imagem antes com "docker compose build" na pasta do projeto e crie /DATA/AppData/sinforoso/.env a partir do .env.example.
  icon: data:image/png;base64,
