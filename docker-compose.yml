# Sinforoso — sobe pelo terminal e aparece no CasaOS com ícone.
# Uso (na pasta do projeto):
#   cp .env.example .env        (preencha GROQ_API_KEY, MYMEMORY_EMAIL etc.)
#   docker compose build && docker compose up -d
#   docker attach sinforoso     (só na 1ª vez: escolha QR code ou código de pareamento)
#   Para sair do attach sem parar o bot: Ctrl+P e depois Ctrl+Q
# Não importe também pelo painel do CasaOS: este arquivo já é o app (os dois usariam o container "sinforoso").
services:
  sinforoso:
    build: .
    image: sinforoso-whatsapp:latest
    container_name: sinforoso
    restart: unless-stopped
    init: true               # encerra o bot direito no docker stop
    # Endurecimento: sem ganho de privilégios, só as capacidades que o entrypoint usa (acertar o
    # dono da pasta storage e trocar para o usuário "node") e limites de recursos, para que um
    # documento pesado nunca derrube o Orange Pi.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 512
    mem_limit: 4g
    cpus: "3.0"
    stdin_open: true         # o bot faz perguntas no terminal na 1ª conexão
    tty: true
    env_file:
      - path: .env
        required: false      # sobe mesmo sem .env (Compose 2.24 ou mais novo)
    environment:
      TZ: America/Sao_Paulo
    volumes:
      # No CasaOS, as pastas de apps costumam ficar em /DATA/AppData
      - ./storage:/app/storage
      # Backups automáticos (todo dia às 4h; os 7 mais recentes). Fora de storage/ de propósito:
      # se a pasta storage se perder, os backups continuam aqui.
      - ./backups:/app/backups
      # Pasta temporária em memória (sintaxe longa, que documenta "size"): sobras de fotos, vídeos,
      # áudios e documentos somem ao reiniciar e não gastam o SSD. Permissão padrão do tmpfs: 1777.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2147483648   # 2 GB
    # Driver "local": o recomendado pela Docker. Ele já faz rotação e compacta os logs.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

# Dados para o painel do CasaOS (formato x-casaos v2). O Docker ignora este bloco.
x-casaos:
  id: com.sinforoso.whatsapp
  main: sinforoso
  index: /
  port_map: ""
  scheme: http
  architectures:
    - arm64
    - amd64
  category: Social
  version: "3.6.0"
  author: olverclock
  developer: olverclock
  title:
    en_US: Sinforoso
    pt_BR: Sinforoso
  tagline:
    en_US: WhatsApp bot with stickers, downloads, games, automations and PDF tools
    pt_BR: Bot de WhatsApp com figurinhas, downloads, jogos, automações e ferramentas de PDF
  description:
    en_US: Brazilian WhatsApp bot running fully on your server. Data stays in the storage folder next to this file.
    pt_BR: Bot brasileiro para WhatsApp rodando inteiro no seu servidor. Os dados ficam na pasta storage ao lado deste arquivo.
  icon: data:image/png;base64,
